<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bullet Hell</title>
<style>
html, body {
  margin: 0; padding: 0; overflow: hidden;
  background: #05050a;
  height: 100%; height: 100dvh;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Courier New', monospace;
  color: #fff;
  user-select: none;
}
#game {
  display: block;
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);   /* tamanho em px definido por app.js */
  background: radial-gradient(ellipse at center, #0a0a18 0%, #000000 100%);
  touch-action: none;
}
#hud {
  position: fixed;
  top: calc(var(--gy, 0px) + 10px); left: calc(var(--gx, 0px) + 10px);
  font-size: 15px;
  text-shadow: 0 0 6px #0ff;
  line-height: 1.5;
  pointer-events: none;
}
#hud .diff { color: #99a; font-size: 13px; }
#hud .powers { color: #ffcc66; font-size: 13px; }
#escHint {
  position: fixed;
  top: calc(var(--gy, 0px) + 6px); right: calc(var(--gx, 0px) + 8px);
  font-size: 14px;
  color: #99a;
  padding: 8px 12px;
  border: 1px solid #334;
  border-radius: 8px;
  background: rgba(5,5,12,0.5);
  cursor: pointer;
  z-index: 5;
}
/* telas estreitas (celular em pé): HUD mais enxuto e barra do chefe embaixo */
.narrow #hud { font-size: 13px; line-height: 1.4; }
.narrow #hud .diff { display: none; }
.narrow #bossBarWrap { top: auto; bottom: calc(var(--gy, 0px) + 30px); }
.narrow #bossLabel { top: auto; bottom: calc(var(--gy, 0px) + 10px); }
#bossBarWrap {
  position: fixed;
  top: calc(var(--gy, 0px) + 10px); left: calc(var(--gx, 0px) + var(--gw, 100%) / 2); transform: translateX(-50%);
  width: min(320px, calc(var(--gw, 100vw) * 0.55)); height: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid #644;
  border-radius: 7px;
  overflow: hidden;
  pointer-events: none;
}
#bossBarFill {
  height: 100%;
  background: linear-gradient(90deg, #ff3355, #ff8855);
  width: 100%;
  transition: width 0.15s;
}
#bossLabel {
  position: fixed;
  top: calc(var(--gy, 0px) + 26px); left: calc(var(--gx, 0px) + var(--gw, 100%) / 2); transform: translateX(-50%);
  font-size: 12px; color: #ff8888;
  pointer-events: none;
}
.hidden { display: none !important; }

.screen {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;   /* os auto-margins abaixo centram sem cortar o topo */
  background: rgba(2,2,6,0.92);
  text-align: center;
  z-index: 10;
  overflow-y: auto;
  padding: 20px 0;
  box-sizing: border-box;
}
.screen > :first-child { margin-top: auto; }
.screen > :last-child { margin-bottom: auto; }
.screen h1 {
  font-size: clamp(1.6em, 7vw, 2.2em);
  color: #0ff;
  text-shadow: 0 0 14px #0ff;
  margin: 0 0 24px;
  letter-spacing: 2px;
}
.menu-btn {
  width: min(300px, 82vw);
  margin: 7px 0;
  padding: 14px 20px;
  font-size: 1.05em;
  font-family: inherit;
  background: rgba(0,255,255,0.06);
  color: #dde;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
}
.menu-btn:hover, .menu-btn.active {
  background: rgba(0,255,255,0.15);
  border-color: #0ff;
  color: #0ff;
  transform: scale(1.03);
}
.menu-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.menu-btn:disabled:hover {
  background: rgba(0,255,255,0.06); border-color: transparent; color: #dde; transform: none;
}
#mainMenuFooter { color: #667; font-size: 13px; margin-top: 18px; max-width: 360px; line-height: 1.5; }
.highscore { color: #888; font-size: 14px; margin-top: 10px; }
#gameOverStats p, #phaseCompleteStats p { margin: 4px 0; color: #ccd; font-size: 1.05em; }
#gameOverStats b, #phaseCompleteStats b { color: #0ff; }

.ranking-table {
  width: min(340px, 90vw);
  margin-top: 10px;
  border-collapse: collapse;
  font-size: 14px;
}
.ranking-table td, .ranking-table th {
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  color: #ccd;
}
.ranking-table th { color: #0ff; font-weight: normal; }
.ranking-table tr.highlight td { color: #ffcc66; font-weight: bold; }

#nameInput {
  margin-top: 14px;
  padding: 10px 14px;
  font-size: 1em;
  font-family: inherit;
  background: rgba(255,255,255,0.06);
  border: 2px solid #0ff;
  border-radius: 6px;
  color: #fff;
  width: 240px;
  text-align: center;
}
#nameInput:focus { outline: none; background: rgba(255,255,255,0.12); }

.subtext { color: #667; font-size: 13px; margin-top: 14px; max-width: 340px; line-height: 1.5; }

#shipsGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  width: min(560px, 90vw);
  margin-top: 10px;
}
.ship-card {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.12s;
  min-height: 130px;
}
.ship-card:hover:not(.locked) { border-color: #0ff; background: rgba(0,255,255,0.08); }
.ship-card.selected { border-color: #0ff; background: rgba(0,255,255,0.15); box-shadow: 0 0 12px rgba(0,255,255,0.4); }
.ship-card.locked { opacity: 0.5; cursor: not-allowed; }
.ship-card img { max-width: 64px; max-height: 52px; margin-bottom: 8px; }
.ship-card .ship-name { font-size: 13px; color: #dde; text-align: center; }
.ship-card .ship-lock { font-size: 11px; color: #ff8888; margin-top: 4px; text-align: center; }
.ship-card .ship-tag { font-size: 10px; color: #0ff; margin-top: 4px; }
.ship-card .lock-icon { font-size: 22px; margin-bottom: 8px; }

/* celular deitado: menus mais compactos para caberem sem rolar */
@media (max-height: 520px) {
  .screen { padding: 8px 0; }
  .screen h1 { font-size: 1.5em; margin: 0 0 8px; }
  .menu-btn { padding: 7px 16px; margin: 3px 0; font-size: 0.95em; }
  #mainMenuFooter, .subtext { display: none; }
  .highscore { margin-top: 4px; font-size: 12px; }
}

</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hpDisplay">Vida: </div>
  <div>Pontos: <span id="scoreDisplay">0</span></div>
  <div>Fase: <span id="phaseDisplay">1</span></div>
  <div class="powers" id="powersDisplay"></div>
  <div class="diff">Dificuldade: <span id="diffDisplay"></span></div>
</div>
<div id="bossBarWrap" class="hidden"><div id="bossBarFill"></div></div>
<div id="bossLabel" class="hidden">CHEFE</div>
<div id="escHint" class="hidden">ESC = pausar</div>

<div id="mainMenu" class="screen">
  <h1>BULLET HELL</h1>
  <button class="menu-btn" data-action="new_game">Novo Jogo</button>
  <button class="menu-btn" id="loadBtn" data-action="load_game">Carregar Jogo</button>
  <button class="menu-btn" data-action="ships">Naves</button>
  <button class="menu-btn" data-action="ranking">Ranking</button>
  <button class="menu-btn" data-action="options">Opções</button>
  <button class="menu-btn" data-action="quit">Sair</button>
  <div class="highscore">Recorde: <span id="highScoreDisplay">0</span></div>
  <div id="mainMenuFooter">Setas/WASD ou mouse/toque para mover - o tiro é automático<br>Shift para focar (movimento lento e preciso)</div>
</div>

<div id="pauseMenu" class="screen hidden">
  <h1>PAUSADO</h1>
  <button class="menu-btn" data-action="resume">Continuar</button>
  <button class="menu-btn" data-action="save_exit">Salvar e voltar ao menu</button>
  <button class="menu-btn" data-action="quit_no_save">Sair sem salvar</button>
</div>

<div id="optionsMenu" class="screen hidden">
  <h1>OPÇÕES</h1>
  <button class="menu-btn" id="diffBtn" data-action="toggle_difficulty"></button>
  <button class="menu-btn" id="hitboxBtn" data-action="toggle_hitbox"></button>
  <button class="menu-btn" data-action="back">Voltar</button>
</div>

<div id="rankingMenu" class="screen hidden">
  <h1>RANKING</h1>
  <table class="ranking-table" id="rankingTable"></table>
  <button class="menu-btn" data-action="back" style="margin-top:20px;">Voltar</button>
</div>

<div id="shipsMenu" class="screen hidden">
  <h1>NAVES</h1>
  <div id="shipsGrid"></div>
  <div id="shipsProgress" class="subtext"></div>
  <button class="menu-btn" data-action="back" style="margin-top:16px;">Voltar</button>
</div>

<div id="enterNameMenu" class="screen hidden">
  <h1>NOVO RECORDE!</h1>
  <div id="enterNameStats"></div>
  <input type="text" id="nameInput" maxlength="12" placeholder="Seu nome">
  <button class="menu-btn" data-action="submit_name" style="margin-top:16px;">Salvar</button>
</div>

<div id="phaseCompleteMenu" class="screen hidden">
  <h1 id="phaseCompleteTitle">FASE COMPLETA</h1>
  <div id="phaseCompleteStats"></div>
  <button class="menu-btn" data-action="next_phase" style="margin-top:20px;">Continuar</button>
</div>

<div id="victoryMenu" class="screen hidden">
  <h1>VOCÊ VENCEU!</h1>
  <div id="victoryStats"></div>
  <button class="menu-btn" data-action="back_to_menu" style="margin-top:20px;">Voltar ao Menu</button>
</div>

<div id="gameOverMenu" class="screen hidden">
  <h1>VOCÊ FOI ATINGIDO</h1>
  <div id="gameOverStats"></div>
  <button class="menu-btn" data-action="back_to_menu" style="margin-top:20px;">Voltar ao Menu</button>
</div>

<script>
// Classe base de tudo que existe na tela.
const FAR = 1e9;

class Entity {
  // margens além da tela antes de ser descartada: [esq, dir, topo, base]
  static BOUNDS = [40, 40, 40, 40];

  constructor(x, y, r) { this.x = x; this.y = y; this.r = r; }

  distanceTo(o) { return Math.hypot(this.x - o.x, this.y - o.y); }
  touches(o, extra = 0) { return this.distanceTo(o) < this.r + o.r + extra; }
  // colisão com o jogador usa a hitbox pequena dele (hitR)
  hurts(player, extra = 0) { return this.distanceTo(player) < this.r + player.hitR + extra; }

  offscreen(game) {
    const [l, r, t, b] = this.constructor.BOUNDS;
    return this.x < -l || this.x > game.width + r || this.y < -t || this.y > game.height + b;
  }

  update(dt, game) {}
  draw(ctx) {}
}

<script>
// Balas: Bullet (base) -> EnemyBullet / PlayerBullet.
class Bullet extends Entity {
  static COLOR = '#ffffff';
  static GLOW = 8;

  constructor(x, y, vx, vy, r, color) {
    super(x, y, r);
    this.vx = vx; this.vy = vy;
    this.color = color || this.constructor.COLOR;
  }
  update(dt, game) {
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor = this.color; ctx.shadowBlur = this.constructor.GLOW; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// Pode ondular (wavy) ou perseguir o jogador por um tempo (homing).
class EnemyBullet extends Bullet {
  constructor(x, y, vx, vy, r, color, opts = {}) {
    super(x, y, vx, vy, r, color);
    this.born = opts.born || 0;
    this.wavy = !!opts.wavy;
    this.phase = Math.random() * Math.PI * 2;
    this.homing = !!opts.homing;
    this.hlife = opts.hlife || 0;
    this.hturn = opts.hturn || 0;
  }
  update(dt, game) {
    if (this.wavy) this.y += Math.sin((game.elapsed - this.born) * 3 + this.phase) * 1.3;
    if (this.homing && game.elapsed - this.born < this.hlife) this._steer(dt, game.player);
    super.update(dt, game);
  }
  _steer(dt, target) {
    const speed = Math.hypot(this.vx, this.vy);
    const cur = Math.atan2(this.vy, this.vx);
    let diff = Math.atan2(target.y - this.y, target.x - this.x) - cur;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const step = this.hturn * dt;
    const next = cur + Math.max(-step, Math.min(step, diff));
    this.vx = Math.cos(next) * speed; this.vy = Math.sin(next) * speed;
  }
}

class PlayerBullet extends Bullet {
  static COLOR = '#aaffff';
  static GLOW = 6;
  static BOUNDS = [20, 20, 20, FAR];   // só some ao sair por cima/lados
  constructor(x, y, vx = 0, vy = -9) { super(x, y, vx, vy, 4); }
}

// Partículas (explosões, faíscas).
class Particle extends Entity {
  constructor(x, y, vx, vy, color, life = 0.6) {
    super(x, y, 2.5);
    this.vx = vx; this.vy = vy; this.color = color; this.life = life;
  }
  // Cria `count` partículas saindo em todas as direções. speed = [min, max].
  static burst(x, y, count, color, { speed = [1, 4], life = 0.6 } = {}) {
    const out = [];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed[0] + Math.random() * (speed[1] - speed[0]);
      out.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, color, life));
    }
    return out;
  }
  get dead() { return this.life <= 0; }
  update(dt, game) {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.94; this.vy *= 0.94;
    this.life -= dt;
  }
  draw(ctx) {
    ctx.globalAlpha = Math.max(this.life, 0);
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

<script>
// Jogador e padrões de tiro.
// nível de tiro -> lista de [dx, dy, vx, vy]
const SHOT_PATTERNS = [
  [[-8, 0, 0, -9], [8, 0, 0, -9]],
  [[-9, 0, -0.6, -9], [0, -4, 0, -9.2], [9, 0, 0.6, -9]],
  [[-12, 0, -1.4, -8.6], [-6, -2, -0.5, -9], [0, -4, 0, -9.3], [6, -2, 0.5, -9], [12, 0, 1.4, -8.6]],
];

class Player extends Entity {
  constructor(game, hp = MAX_HP) {
    super(game.width / 2, game.height * 0.82, 16);
    this.hitR = 3;
    this.speed = 4.2;
    this.focusSpeed = 2;
    this.hp = hp;
    this.invuln = 0;
  }

  // input.mode: 'keyboard' | 'mouse' | null — teclado e mouse nunca disputam o controle
  // (evita o "puxão" de volta pra posição antiga do mouse).
  update(dt, game, input) {
    const keys = input.keys;
    const focus = !!keys['shift'];
    const spd = (focus ? this.focusSpeed : this.speed) * dt * 60;

    if (input.mode === 'keyboard') {
      const dx = ((keys['arrowright'] || keys['d']) ? 1 : 0) - ((keys['arrowleft'] || keys['a']) ? 1 : 0);
      const dy = ((keys['arrowdown'] || keys['s']) ? 1 : 0) - ((keys['arrowup'] || keys['w']) ? 1 : 0);
      const len = Math.hypot(dx, dy);
      if (len) { this.x += dx / len * spd; this.y += dy / len * spd; }
    } else if (input.mode === 'mouse' && input.mouse.active) {
      const mdx = input.mouse.x - this.x, mdy = input.mouse.y - this.y;
      const dist = Math.hypot(mdx, mdy);
      const step = spd * (input.touchActive ? 1.4 : 1);
      if (dist > step) { this.x += mdx / dist * step; this.y += mdy / dist * step; }
      else { this.x = input.mouse.x; this.y = input.mouse.y; }
    }

    this.x = Math.max(this.r, Math.min(game.width - this.r, this.x));
    this.y = Math.max(this.r, Math.min(game.height - this.r, this.y));
    this.invuln = Math.max(0, this.invuln - dt);
    return focus;
  }

  shoot(shotLevel) {
    const baseY = this.y - 14;
    return SHOT_PATTERNS[shotLevel].map(([dx, dy, vx, vy]) => new PlayerBullet(this.x + dx, baseY + dy, vx, vy));
  }

  draw(ctx, game, focus, showHitbox, shieldCharges, ship) {
    if (shieldCharges > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(85,204,255,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r + 6 + shieldCharges, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    if (this.invuln > 0 && Math.floor(game.elapsed * 12) % 2 === 0) return; // piscando
    ctx.save();
    if (ship.loaded) {
      ctx.shadowColor = 'rgba(0,255,255,0.6)'; ctx.shadowBlur = 10;
      ctx.drawImage(ship.img, this.x - ship.w / 2, this.y - ship.h / 2, ship.w, ship.h);
    } else {
      ctx.shadowColor = '#0ff'; ctx.shadowBlur = 15; ctx.fillStyle = '#0ff';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    }
    if (focus || showHitbox) {
      ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.hitR, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

<script>
// Padrões de bala reutilizáveis. `game` fornece a lista de balas e o tempo.
const Patterns = {
  ring(game, cx, cy, count, speed, color, radius = 5) {
    const offset = Math.random() * Math.PI * 2;
    for (let i = 0; i < count; i++) {
      const a = offset + (i / count) * Math.PI * 2;
      game.enemyBullets.push(new EnemyBullet(cx, cy, Math.cos(a) * speed, Math.sin(a) * speed, radius, color, { born: game.elapsed }));
    }
  },
  aimed(game, cx, cy, count, spread, speed, color) {
    const base = Math.atan2(game.player.y - cy, game.player.x - cx);
    for (let i = 0; i < count; i++) {
      const a = base + (i - (count - 1) / 2) * spread;
      game.enemyBullets.push(new EnemyBullet(cx, cy, Math.cos(a) * speed, Math.sin(a) * speed, 5, color, { born: game.elapsed }));
    }
  },
};

// Inimigos comuns: Enemy (base) -> Descender (Drifter, Shooter), Diver, Kamikaze.
class Enemy extends Entity {
  static BOUNDS = [60, 60, 120, 40];
  static POINTS = 0;
  static RADIUS = 10;
  static COLOR = '#ffffff';
  static DIES_ON_CONTACT = false;

  constructor(hp, game) {
    const C = new.target;
    super(0, 0, C.RADIUS);
    this.hp = this.maxHp = Math.max(1, Math.round(hp * game.d.hp));
    this.color = C.COLOR;
    this.points = C.POINTS;
    this.fireTimer = Math.random();
    this.fireInterval = 999;
  }

  // Retorna true se morreu.
  takeHit(damage = 1) { this.hp -= damage; return this.hp <= 0; }

  update(dt, game) { this.fireTimer += dt; }

  tryFire(game) {
    if (this.fireTimer > this.fireInterval) {
      this.fireTimer = 0;
      this.shoot(game);
    }
  }
  shoot(game) {}

  draw(ctx) {
    ctx.save();
    ctx.shadowColor = this.color; ctx.shadowBlur = 10; ctx.fillStyle = this.color;
    this.drawBody(ctx);
    ctx.restore();
    if (this.maxHp > 1) {
      const w = this.r * 2;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(this.x - w / 2, this.y - this.r - 8, w, 3);
      ctx.fillStyle = '#88ff88';
      ctx.fillRect(this.x - w / 2, this.y - this.r - 8, w * Math.max(this.hp, 0) / this.maxHp, 3);
    }
  }
  drawBody(ctx) {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
}

// Entra por cima, desce até targetY e fica parado atirando.
class Descender extends Enemy {
  static VY = 1.0;
  static TARGET_Y = [90, 210];
  static X_MARGIN = 40;
  static FIRE = [1.4, 2.0];

  constructor(hp, game) {
    super(hp, game);
    const C = new.target;
    this.x = C.X_MARGIN + Math.random() * (game.width - 2 * C.X_MARGIN);
    this.y = -30;
    this.targetY = C.TARGET_Y[0] + Math.random() * (C.TARGET_Y[1] - C.TARGET_Y[0]);
    this.fireInterval = (C.FIRE[0] + Math.random() * (C.FIRE[1] - C.FIRE[0])) / game.d.fire;
  }
  update(dt, game) {
    if (this.y < this.targetY) this.y += this.constructor.VY;
    super.update(dt, game);
  }
}

class Drifter extends Descender {
  static POINTS = 80; static RADIUS = 14; static COLOR = '#ff8855';
  static VY = 1.6; static TARGET_Y = [90, 210]; static FIRE = [1.4, 2.0];
  shoot(game) {
    const d = game.d;
    Patterns.aimed(game, this.x, this.y, d.count > 1.2 ? 2 : 1, 0.18, 3.2 * d.bullet, '#ff6699');
  }
}

class Shooter extends Descender {
  static POINTS = 100; static RADIUS = 16; static COLOR = '#cc66ff';
  static VY = 1.2; static TARGET_Y = [70, 160]; static FIRE = [1.6, 2.0]; static X_MARGIN = 60;
  shoot(game) {
    const d = game.d;
    Patterns.ring(game, this.x, this.y, Math.round(10 * d.count), 1.8 * d.bullet, '#cc88ff');
  }
  drawBody(ctx) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const px = this.x + Math.cos(a) * this.r, py = this.y + Math.sin(a) * this.r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
}

// Cruza a tela de lado, ondulando, e atira mirado.
class Diver extends Enemy {
  static POINTS = 60; static RADIUS = 11; static COLOR = '#66ccff';
  constructor(hp, game) {
    super(hp, game);
    const fromLeft = Math.random() < 0.5;
    this.x = fromLeft ? -20 : game.width + 20;
    this.y = 60 + Math.random() * 140;
    this.vx = (fromLeft ? 1 : -1) * (2.2 + Math.random() * 0.6) * (0.85 + 0.15 * game.d.bullet);
    this.phase = Math.random() * Math.PI * 2;
    this.fireInterval = (1.0 + Math.random() * 0.5) / game.d.fire;
  }
  update(dt, game) {
    this.x += this.vx;
    this.y += Math.sin(game.elapsed * 2 + this.phase) * 1.1;
    super.update(dt, game);
  }
  shoot(game) {
    const d = game.d;
    Patterns.aimed(game, this.x, this.y, d.count > 1.2 ? 2 : 1, 0.18, 3.2 * d.bullet, '#ff6699');
  }
}

// Persegue o jogador em tempo real, com limite de curva (dá pra desviar).
class Kamikaze extends Enemy {
  static POINTS = 40; static RADIUS = 9; static COLOR = '#ff4466';
  static DIES_ON_CONTACT = true;
  static HOMING_TIME = 3.8; static WARN_TIME = 0.6;

  constructor(hp, game) {
    super(hp, game);
    const C = new.target;
    this.x = 20 + Math.random() * (game.width - 40);
    this.y = -20;
    this.ang = Math.PI / 2;
    this.speed = (3.2 + Math.random() * 0.5) * game.d.kamiSpeed;
    this.turn = game.d.kamiTurn;
    this.homing = C.HOMING_TIME;
    this.warn = C.WARN_TIME;
  }
  update(dt, game) {
    this.warn -= dt;
    if (this.homing > 0) {
      this.homing -= dt;
      const want = Math.atan2(game.player.y - this.y, game.player.x - this.x);
      const diff = Math.atan2(Math.sin(want - this.ang), Math.cos(want - this.ang));
      const step = this.turn * dt;
      this.ang += Math.max(-step, Math.min(step, diff));
    }
    const spd = this.speed * (this.warn > 0 ? 0.35 : 1) * dt * 60;
    this.x += Math.cos(this.ang) * spd;
    this.y += Math.sin(this.ang) * spd;
  }
  drawBody(ctx) {
    if (this.warn > 0 && Math.floor(this.warn * 14) % 2 === 0) { ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; }
    ctx.translate(this.x, this.y);
    ctx.rotate(this.ang + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -this.r * 1.3);
    ctx.lineTo(-this.r * 0.9, this.r);
    ctx.lineTo(0, this.r * 0.5);
    ctx.lineTo(this.r * 0.9, this.r);
    ctx.closePath(); ctx.fill();
  }
}

const ENEMY_TYPES = { drifter: Drifter, diver: Diver, shooter: Shooter, kamikaze: Kamikaze };
function createEnemy(kind, hp, game) { return new ENEMY_TYPES[kind](hp, game); }

<script>
// Efeitos temporários gerados pelos chefes (rajadas, paredes, avisos de feixe).
// Contrato: update(dt, boss, game) -> true enquanto estiver ativo; draw(ctx, game) opcional.
class BossEffect {
  update(dt, boss, game) { return false; }
  draw(ctx, game) {}
}

// Rajada contínua de braços girando saindo do chefe.
class FlowerStream extends BossEffect {
  constructor(arms, step, speed, color, duration = 2.2) {
    super();
    Object.assign(this, { arms, step, speed, color, timeLeft: duration, acc: 0, angle: Math.random() * 6.28 });
  }
  update(dt, boss, game) {
    this.timeLeft -= dt; this.acc += dt;
    while (this.acc >= this.step) {
      this.acc -= this.step; this.angle += 0.28;
      for (let k = 0; k < this.arms; k++) {
        const a = this.angle + k * Math.PI * 2 / this.arms;
        game.enemyBullets.push(new EnemyBullet(boss.x, boss.y, Math.cos(a) * this.speed, Math.sin(a) * this.speed, 4, this.color, { born: game.elapsed }));
      }
    }
    return this.timeLeft > 0;
  }
}

// Linha de balas descendo com uma abertura (após `delay` segundos).
class WallStream extends BossEffect {
  constructor(delay = 0) { super(); this.delay = delay; }
  update(dt, boss, game) {
    if (this.delay > 0) { this.delay -= dt; return true; }
    const gap = game.d.gap;
    const gx = 20 + Math.random() * (game.width - gap - 40);
    for (let x = 12; x < game.width; x += 30) {
      if (x > gx && x < gx + gap) continue;
      game.enemyBullets.push(new EnemyBullet(x, -10, 0, 2.4 * game.d.bullet, 6, boss.color2, { born: game.elapsed }));
    }
    return false;
  }
}

// Linha vermelha que pisca e depois vira uma coluna rápida de balas.
class BeamWarning extends BossEffect {
  constructor(x, time = 0.9) { super(); this.x = x; this.timeLeft = time; }
  update(dt, boss, game) {
    this.timeLeft -= dt;
    if (this.timeLeft > 0) return true;
    for (let k = 0; k < 16; k++) {
      game.enemyBullets.push(new EnemyBullet(this.x, -10 - k * 20, 0, 7 * game.d.bullet, 4, '#ffffff', { born: game.elapsed }));
    }
    return false;
  }
  draw(ctx, game) {
    ctx.save();
    const a = 0.25 + 0.5 * Math.abs(Math.sin(this.timeLeft * 18));
    ctx.strokeStyle = `rgba(255,80,80,${a})`; ctx.lineWidth = 2 + (0.9 - this.timeLeft) * 6;
    ctx.beginPath(); ctx.moveTo(this.x, 0); ctx.lineTo(this.x, game.height); ctx.stroke();
    ctx.restore();
  }
}

<script>
// BossAttacks (mixin): biblioteca de ataques reutilizáveis dos chefes.
// Cada ataque é um método atk_<nome>(game); Boss._runAttacks os encontra pelo nome listado em ATTACKS.
const BossAttacks = Base => class extends Base {
  // Quantidade de balas: escala com a dificuldade e com a fúria.
  n(k, game) { return Math.max(2, Math.round(k * game.d.count) + (this.enraged ? 2 : 0)); }

  spawn(game, x, y, vx, vy, r, color, opts = {}) {
    game.enemyBullets.push(new EnemyBullet(x, y, vx, vy, r, color, { born: game.elapsed, ...opts }));
  }

  atk_ring(game) { Patterns.ring(game, this.x, this.y, this.n(16, game), 2.0 * game.d.bullet, this.color); }
  atk_aimed(game) { Patterns.aimed(game, this.x, this.y, this.n(5, game), 0.16, 3.6 * game.d.bullet, '#ffcc33'); }
  atk_fan(game) { Patterns.aimed(game, this.x, this.y, this.n(7, game), 0.2, 3.0 * game.d.bullet, this.color2); }

  atk_flower(game) {
    const arms = (this.enraged ? 4 : 3) + (game.d.count > 1.2 ? 1 : 0);
    this.effects.push(new FlowerStream(arms, this.enraged ? 0.07 : 0.1, 2.3 * game.d.bullet, this.color2));
  }
  atk_rain(game) {
    const m = this.n(12, game) + 4;
    for (let i = 0; i < m; i++) {
      this.spawn(game, (i + Math.random()) / m * game.width, -10, 0, (2 + Math.random() * 1.5) * game.d.bullet, 5, '#ffcc66');
    }
  }
  atk_wall(game) {
    for (let w = 0; w < (this.enraged ? 2 : 1); w++) this.effects.push(new WallStream(w * 0.9));
  }
  atk_beam(game) {
    const count = Math.max(2, Math.round(2 * game.d.count) + (this.enraged ? 1 : 0));
    for (let i = 0; i < count; i++) {
      this.effects.push(new BeamWarning(i === 0 ? game.player.x : 30 + Math.random() * (game.width - 60)));
    }
  }
  atk_homing(game) {
    const m = Math.max(2, Math.round(3 * game.d.count) + (this.enraged ? 1 : 0));
    const sp = game.d.bullet;
    for (let i = 0; i < m; i++) {
      const a = Math.PI / 2 + (i - (m - 1) / 2) * 0.6;
      this.spawn(game, this.x, this.y, Math.cos(a) * 1.8 * sp, Math.sin(a) * 1.8 * sp, 8, '#ff66ff',
        { homing: true, hlife: 3.2, hturn: 1.1 + sp * 0.3 });
    }
  }
};

<script>
// Boss (base): ciclo de vida, fúria, ataques e desenho comuns.
//
// Para criar um chefe novo: herde de Boss, defina NAME/RADIUS/RATE/COLOR/COLOR2/ATTACKS,
// implemente move() e drawBody(), e (se precisar) novos métodos atk_<nome>().
// Os nomes em ATTACKS são procurados como métodos `atk_<nome>` (biblioteca em boss_attacks.js).
class Boss extends BossAttacks(Entity) {
  static NAME = 'Chefe';
  static RADIUS = 40;
  static RATE = 1.3;            // segundos entre ataques (dividido pela dificuldade)
  static COLOR = '#ffffff';
  static COLOR2 = '#ffffff';
  static ATTACKS = ['ring'];
  static BOUNDS = [200, 200, 200, 200];

  constructor(hp, game) {
    const C = new.target;
    super(game.width / 2, -60, C.RADIUS);
    this.name = C.NAME; this.color = C.COLOR; this.color2 = C.COLOR2;
    this.hp = this.maxHp = hp * game.d.bossHp;
    this.attackIndex = 0; this.attackTimer = 0; this.moveTimer = 0;
    this.entering = true; this.enraged = false;
    this.alpha = 1; this.flash = 0;
    this.effects = [];
  }

  // ---------- ciclo de vida ----------
  takeHit(damage = 1) { this.hp -= damage; return this.hp <= 0; }

  update(dt, game) {
    if (this.entering) {
      this.y += 1.6;
      if (this.y >= 110) { this.y = 110; this.entering = false; }
      return;
    }
    this.moveTimer += dt;
    this.flash = Math.max(0, this.flash - dt);
    if (!this.enraged && this.hp <= this.maxHp * 0.5) this._enrage(game);
    this.move(dt, game);
    this._runAttacks(dt, game);
    this.effects = this.effects.filter(fx => fx.update(dt, this, game));
  }

  _enrage(game) {
    this.enraged = true; this.flash = 1; this.attackTimer = -0.9;
    this.effects = [];
    game.enemyBullets = [];
    game.particles.push(...Particle.burst(this.x, this.y, 40, '#ff2244', { speed: [2, 6], life: 0.8 }));
  }

  move(dt, game) {}
  canAttack() { return true; }
  // Causa dano por contato (o Arauto invisível não causa).
  solid() { return this.alpha > 0.5; }

  _runAttacks(dt, game) {
    this.attackTimer += dt;
    const interval = this.constructor.RATE / game.d.bossRate * (this.enraged ? 0.72 : 1);
    if (this.attackTimer > interval && this.canAttack()) {
      this.attackTimer = 0;
      const list = this.constructor.ATTACKS;
      this['atk_' + list[this.attackIndex % list.length]](game);
      this.attackIndex++;
    }
  }

  // ---------- desenho ----------
  // Subclasses desenham aqui; a origem do ctx já é o centro do chefe.
  drawBody(ctx, t, angle, main) {
    ctx.fillStyle = main;
    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
  }

  draw(ctx, game) {
    for (const fx of this.effects) fx.draw(ctx, game);
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.shadowColor = this.enraged ? '#ff2244' : this.color;
    ctx.shadowBlur = this.enraged ? 32 : 20;
    const angle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
    const flashing = this.flash > 0 && Math.floor(this.flash * 16) % 2 === 0;
    this.drawBody(ctx, this.moveTimer, angle, flashing ? '#ffffff' : this.color);
    ctx.restore();
  }

  // pequeno helper usado nos corpos
  circ(ctx, x, y, rad) { ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); }
}

</script>

  _hexagon(ctx, rx, ry) {

      const px = Math.cos(a) * rx, py = Math.sin(a) * ry;

<script>
// Fase 5: asas e olho vertical; some, reaparece em outro lugar e solta orbes perseguidores.
class VoidHerald extends Boss {
  static NAME = 'Arauto do Vácuo'; static RADIUS = 50; static RATE = 1.3;
  static COLOR = '#9966ff'; static COLOR2 = '#e0ccff';
  static ATTACKS = ['blink', 'homing', 'fan', 'blink', 'homing'];
  static FADE = 0.3;

  constructor(hp, game) {
    super(hp, game);
    this.blink = null;          // null ou { phase: 0 (some) | 1 (volta), t }
    this.targetX = game.width / 2;
  }
  canAttack() { return this.blink === null; }
  atk_blink(game) { this.blink = { phase: 0, t: 0 }; }

  move(dt, game) {
    if (this.blink) { this._updateBlink(dt, game); return; }
    const t = this.moveTimer;
    this.targetX = game.width / 2 + Math.sin(t * 0.4) * game.width * 0.22;
    this.x += (this.targetX - this.x) * Math.min(1, dt * 1.5);
    this.y = 110 + Math.sin(t * 0.9) * 15;
  }
  _updateBlink(dt, game) {
    const b = this.blink, fade = VoidHerald.FADE, d = game.d;
    b.t += dt;
    if (b.phase === 0) {
      this.alpha = Math.max(0, 1 - b.t / fade);
      if (b.t >= fade) {
        this.blink = { phase: 1, t: 0 };
        this.targetX = this.x = game.width * (0.15 + Math.random() * 0.7);
      }
    } else {
      this.alpha = Math.min(1, b.t / fade);
      if (b.t >= fade) {
        this.alpha = 1; this.blink = null;
        Patterns.ring(game, this.x, this.y, Math.round((this.enraged ? 20 : 14) * d.count), 2.2 * d.bullet, this.color);
        Patterns.aimed(game, this.x, this.y, 3, 0.2, 3.6 * d.bullet, this.color2);
      }
    }
  }
  drawBody(ctx, t, angle, main) {
    const r = this.r, flap = Math.sin(t * 4) * 0.25;
    ctx.fillStyle = main;
    for (const sg of [-1, 1]) {
      ctx.save(); ctx.scale(sg, 1); ctx.rotate(flap);
      ctx.beginPath(); ctx.moveTo(r * 0.3, -r * 0.3); ctx.lineTo(r * 1.5, -r * 0.9 + flap * 20); ctx.lineTo(r * 1.1, r * 0.1);
      ctx.lineTo(r * 1.35, r * 0.7); ctx.lineTo(r * 0.3, r * 0.4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#2a1a55'; this.circ(ctx, 0, 0, r * 0.62);
    ctx.shadowBlur = 0; ctx.fillStyle = main; this.circ(ctx, 0, 0, r * 0.62 * 0.9);
    ctx.fillStyle = '#1a0f33'; this.circ(ctx, 0, r * 0.05, r * 0.5);
    ctx.fillStyle = this.enraged ? '#ff2244' : this.color2;
    ctx.beginPath(); ctx.ellipse(Math.cos(angle) * 4, Math.sin(angle) * 3, r * 0.08, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  }
}

  move(dt, game) {
    const t = this.moveTimer;
    this.x = game.width / 2 + Math.sin(t * 0.5) * game.width * 0.3;
    this.y = 120 + Math.sin(t * 1.0) * 40;      // trajetória em "8"
  }
  drawBody(ctx, t, angle, main) {
    const r = this.r;
    ctx.save(); ctx.scale(1, 0.35);
    for (const dir of [1, -1]) {
      ctx.save(); ctx.rotate(t * 0.8 * dir);
      ctx.strokeStyle = dir > 0 ? this.color2 : '#ffffff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 26;
    ctx.fillStyle = '#000'; this.circ(ctx, 0, 0, r * 0.7);
    ctx.strokeStyle = this.enraged ? '#ff2244' : '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff';
    for (let k = 0; k < 10; k++) {
      const a = t * 2 + k * Math.PI / 5, rad = r * (0.95 + 0.1 * Math.sin(t * 3 + k));
      this.circ(ctx, Math.cos(a) * rad, Math.sin(a) * rad, 2.5);
    }
  }
}

// Liga o campo "kind" das fases a cada classe de chefe.
const BOSS_TYPES = {
  sentinel: Sentinel, spiral: SpiralGuardian, core: CollapsingCore,
  colossus: ArmoredColossus, herald: VoidHerald, singularity: Singularity,
};
function createBoss(cfg, game) { return new BOSS_TYPES[cfg.kind](cfg.hp, game); }

</script>
<script>
// Pontuação máxima teórica (matando 100% dos inimigos + chefes de todas as fases).
// Usada para calcular os marcos de desbloqueio das naves como % desse total.
function computeMaxPossibleScore() {
  let total = 0;
  for (const phase of PHASES) {
    for (const wave of phase.waves) total += ENEMY_TYPES[wave.type].POINTS * wave.count;
    total += BOSS_POINTS;
  }
  return total;
}

const MAX_POSSIBLE_SCORE = computeMaxPossibleScore();

<script>
// Salvar/carregar opções, jogo e ranking (localStorage).
class SaveStore {
  static DEFAULT_SETTINGS = { difficulty: 'Normal', showHitboxAlways: false, highScore: 0, selectedShip: 'plane' };

  _read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  _write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

  loadSettings() { return { ...SaveStore.DEFAULT_SETTINGS, ...this._read(STORAGE_KEYS.settings, {}) }; }
  saveSettings(s) { this._write(STORAGE_KEYS.settings, s); }

  hasSave() { try { return !!localStorage.getItem(STORAGE_KEYS.save); } catch (e) { return false; } }
  loadGame() { return this._read(STORAGE_KEYS.save, null); }
  saveGame(data) { this._write(STORAGE_KEYS.save, data); }
  deleteSave() { try { localStorage.removeItem(STORAGE_KEYS.save); } catch (e) {} }

  loadRanking() { return this._read(STORAGE_KEYS.ranking, []); }
  rankingQualifies(score) {
    const list = this.loadRanking();
    return list.length < RANKING_SIZE || score > list[list.length - 1].score;
  }
  addToRanking(name, score, phaseLabel) {
    const list = this.loadRanking();
    list.push({ name: name || 'Jogador', score: Math.floor(score), phase: phaseLabel });
    list.sort((a, b) => b.score - a.score);
    const top = list.slice(0, RANKING_SIZE);
    this._write(STORAGE_KEYS.ranking, top);
    return top;
  }
}

<script>
// Entrada do jogador (teclado, mouse, toque).
// mode evita que teclado e mouse "briguem" pelo controle:
//   'keyboard' -> ignora o mouse até ele se mexer de novo; 'mouse' -> segue o cursor/toque.
class Input {
  static MOVE_KEYS = ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'a', 'd', 'w', 's'];

  constructor(canvas) {
    this.canvas = canvas;
    this.keys = {};
    this.mouse = { x: 0, y: 0, active: false };
    this.touchActive = false;
    this.mode = null;
  }

  reset(player) {
    this.keys = {};
    this.mouse = { x: player.x, y: player.y, active: false };
    this.touchActive = false;
    this.mode = null;
  }

  // isPlaying(): função que diz se estamos jogando; onEscape(): chamada ao apertar ESC.
  bind(isPlaying, onEscape) {
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      this.keys[k] = true;
      if (Input.MOVE_KEYS.includes(k)) this.mode = 'keyboard';
      if (e.key === 'Escape') onEscape();
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });

    this.canvas.addEventListener('mousemove', e => {
      if (!isPlaying()) return;
      this._point(e.clientX, e.clientY);
      this.mode = 'mouse';
    });
    this.canvas.addEventListener('mouseleave', () => { this.mouse.active = false; });

    const touch = e => {
      if (!isPlaying()) return;
      e.preventDefault();
      const t = e.touches[0];
      if (t) { this._point(t.clientX, t.clientY); this.touchActive = true; this.mode = 'mouse'; }
    };
    this.canvas.addEventListener('touchstart', touch, { passive: false });
    this.canvas.addEventListener('touchmove', touch, { passive: false });
    this.canvas.addEventListener('touchend', () => { this.touchActive = false; }, { passive: false });
  }

  _point(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    const sx = this.canvas.width / rect.width, sy = this.canvas.height / rect.height;   // tela -> campo de jogo
    this.mouse.x = (clientX - rect.left) * sx;
    this.mouse.y = (clientY - rect.top) * sy;
    this.mouse.active = true;
  }
}

</script>
<script>
// Controla o fluxo de uma fase: ondas de inimigos -> chefe -> fase completa.
class PhaseRunner {
  static WAVES = 'waves'; static BOSS = 'boss'; static COMPLETE = 'complete';

  constructor(index = 0) {
    this.index = index;
    this.reset();
  }
  reset() {
    this.waveIndex = 0; this.spawned = 0; this.timer = 0;
    this.state = PhaseRunner.WAVES;
    this.boss = null;
  }
  get data() { return PHASES[this.index]; }
  get name() { return this.data ? this.data.name : ''; }
  get isComplete() { return this.state === PhaseRunner.COMPLETE; }
  get isLast() { return this.index >= PHASES.length - 1; }

  finishBoss() { this.boss = null; this.state = PhaseRunner.COMPLETE; }

  update(dt, game) {
    if (this.state === PhaseRunner.WAVES) this._updateWaves(dt, game);
    else if (this.state === PhaseRunner.BOSS && this.boss) this.boss.update(dt, game);
  }

  _updateWaves(dt, game) {
    const wave = this.data.waves[this.waveIndex];
    if (!wave) {
      this.state = PhaseRunner.BOSS;
      this.boss = createBoss(this.data.boss, game);
      return;
    }
    const d = game.d;
    const count = Math.max(1, Math.round(wave.count * d.waveN));
    this.timer += dt;
    if (this.spawned < count && this.timer > wave.interval * d.spawn) {
      this.timer = 0;
      const enemy = createEnemy(wave.type, wave.hp, game);
      // a onda inteira vale o mesmo em qualquer dificuldade (mantém os marcos das naves justos)
      enemy.points = enemy.constructor.POINTS * wave.count / count;
      game.enemies.push(enemy);
      this.spawned++;
    }
    if (this.spawned >= count && game.enemies.length === 0) {
      this.waveIndex++; this.spawned = 0; this.timer = 0;
    }
  }
}

</script>
<script>
// Collisions: atualiza projéteis/inimigos/power-ups da partida e resolve os contatos.
class Collisions {
  constructor(game) { this.game = game; }

  updatePlayerBullets(dt) {
    const g = this.game;
    g.playerBullets = g.playerBullets.filter(b => {
      b.update(dt, g);
      return !b.offscreen(g) && !this._bulletHitsTarget(b);
    });
  }

  _bulletHitsTarget(b) {
    const g = this.game;
    for (const en of g.enemies) {
      if (b.touches(en)) {
        if (en.takeHit()) {
          g.killEnemy(en);
          g.enemies.splice(g.enemies.indexOf(en), 1);
        }
        return true;
      }
    }
    const boss = g.boss;
    if (boss && b.touches(boss)) {
      g.particles.push(...Particle.burst(b.x, b.y, 4, '#ffff88', { speed: [2, 2], life: 0.25 }));
      if (boss.takeHit()) g.killBoss();
      return true;
    }
    return false;
  }

  updateEnemies(dt) {
    const g = this.game;
    for (const en of [...g.enemies]) {
      en.update(dt, g);
      if (en.offscreen(g)) { g.enemies.splice(g.enemies.indexOf(en), 1); continue; }
      en.tryFire(g);
      if (g.player.invuln <= 0 && en.hurts(g.player, 3)) {
        g.onPlayerHit();
        if (en.constructor.DIES_ON_CONTACT) {
          const i = g.enemies.indexOf(en);
          if (i >= 0) g.enemies.splice(i, 1);
        }
      }
    }
  }

  updateEnemyBullets(dt) {
    const g = this.game;
    g.enemyBullets = g.enemyBullets.filter(b => {
      b.update(dt, g);
      if (b.offscreen(g)) return false;
      if (g.player.invuln <= 0 && b.hurts(g.player)) { g.onPlayerHit(); return false; }
      return true;
    });
  }

  updatePowerUps(dt) {
    const g = this.game;
    g.powerUps = g.powerUps.filter(p => {
      p.update(dt, g);
      if (p.offscreen(g)) return false;
      if (p.touches(g.player)) { g.applyPowerUp(p.kind); return false; }
      return true;
    });
  }
}

</script>
<script>
// GameSession: uma partida em andamento (entidades, colisões, power-ups, pontuação).
class GameSession {
  constructor(canvas, { difficulty = 'Normal', phaseIndex = 0, score = 0, hp = MAX_HP,
                        shotLevel = 0, fireLevel = 0, shieldCharges = 0, shipId = 'plane' } = {}) {
    this.canvas = canvas;
    this.player = new Player(this, hp);
    this.shipId = shipId;
    this.difficulty = difficulty;
    this.phase = new PhaseRunner(phaseIndex);
    this.collisions = new Collisions(this);

    this.enemyBullets = []; this.playerBullets = [];
    this.enemies = []; this.particles = []; this.powerUps = [];

    this.elapsed = 0;
    this.score = score;
    this.alive = true;
    this.hitFlash = 0;
    this.fireTimer = 0;
    Object.assign(this, { shotLevel, fireLevel, shieldCharges });
  }

  // ---------- construção / save ----------
  static restore(canvas, data, settings) {
    return new GameSession(canvas, {
      difficulty: data.difficulty || settings.difficulty,
      phaseIndex: data.phaseIndex || 0,
      score: data.score || 0,
      hp: data.hp != null ? data.hp : MAX_HP,
      shotLevel: data.shotLevel || 0,
      fireLevel: data.fireLevel || 0,
      shieldCharges: data.shieldCharges || 0,
      shipId: settings.selectedShip,
    });
  }
  snapshot() {
    return { phaseIndex: this.phase.index, score: this.score, hp: this.player.hp, difficulty: this.difficulty,
             shotLevel: this.shotLevel, fireLevel: this.fireLevel, shieldCharges: this.shieldCharges };
  }

  // ---------- atalhos ----------
  get width() { return this.canvas.width; }
  get height() { return this.canvas.height; }
  get d() { return DIFF[this.difficulty] || DIFF.Normal; }
  get boss() { return this.phase.boss; }
  fireCooldown() { return 0.16 * Math.pow(0.82, this.fireLevel); }

  nextPhase() {
    this.phase = new PhaseRunner(this.phase.index + 1);
    this.enemyBullets = []; this.enemies = [];
  }

  // ---------- eventos de jogo ----------
  applyPowerUp(kind) {
    if (kind === 'spread') this.shotLevel = Math.min(MAX_SHOT_LEVEL, this.shotLevel + 1);
    else if (kind === 'rapidfire') this.fireLevel = Math.min(MAX_FIRE_LEVEL, this.fireLevel + 1);
    else if (kind === 'shield') this.shieldCharges = Math.min(MAX_SHIELD, this.shieldCharges + 1);
    else if (kind === 'life') {
      if (this.player.hp < MAX_HP) this.player.hp += 1;
      else this.score += 200;
    }
  }

  maybeDropPowerUp(x, y, guaranteed = false) {
    if (guaranteed || Math.random() <= this.d.drop) {
      this.powerUps.push(new PowerUp(x, y, POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)]));
    }
  }

  onPlayerHit() {
    const p = this.player;
    if (this.shieldCharges > 0) {
      this.shieldCharges -= 1;
      p.invuln = 0.6; this.hitFlash = 0.5;
      this.particles.push(...Particle.burst(p.x, p.y, 14, '#55ccff', { speed: [2.4, 2.4], life: 0.4 }));
      return;
    }
    p.hp -= 1;
    p.invuln = 1.6; this.hitFlash = 1;
    this.particles.push(...Particle.burst(p.x, p.y, 18, '#ff3355'));
    if (p.hp <= 0) this.alive = false;
  }

  killEnemy(en) {
    this.score += en.points;
    this.particles.push(...Particle.burst(en.x, en.y, 14, en.color, { life: 0.5 }));
    this.maybeDropPowerUp(en.x, en.y);
  }

  killBoss() {
    const b = this.boss;
    this.score += BOSS_POINTS;
    this.particles.push(...Particle.burst(b.x, b.y, 50, '#ffaa55', { speed: [1, 6], life: 1.0 }));
    this.maybeDropPowerUp(b.x, b.y, true);
    this.phase.finishBoss();
    this.enemyBullets = [];
  }

  // ---------- atualização ----------
  update(dt, input) {
    this.elapsed += dt;
    const focus = this.player.update(dt, this, input);

    this.fireTimer += dt;
    if (this.fireTimer > this.fireCooldown()) {     // tiro automático, independe do controle
      this.fireTimer = 0;
      this.playerBullets.push(...this.player.shoot(this.shotLevel));
    }

    this.collisions.updatePlayerBullets(dt);
    this.phase.update(dt, this);
    this.collisions.updateEnemies(dt);
    this.collisions.updateEnemyBullets(dt);
    this.collisions.updatePowerUps(dt);

    for (const p of this.particles) p.update(dt, this);
    this.particles = this.particles.filter(p => !p.dead);
    this.hitFlash = Math.max(0, this.hitFlash - 0.04);

    const boss = this.boss;
    if (boss && boss.solid() && this.player.invuln <= 0 && boss.hurts(this.player)) this.onPlayerHit();
    return focus;
  }

  // ---------- desenho ----------
  draw(ctx, focus, showHitbox) {
    ctx.fillStyle = 'rgba(5,5,12,0.35)';
    ctx.fillRect(0, 0, this.width, this.height);
    if (this.hitFlash > 0) {
      ctx.fillStyle = `rgba(255,0,60,${this.hitFlash * 0.25})`;
      ctx.fillRect(0, 0, this.width, this.height);
    }
    for (const list of [this.enemyBullets, this.enemies]) for (const e of list) e.draw(ctx);
    if (this.boss) this.boss.draw(ctx, this);
    for (const list of [this.powerUps, this.playerBullets, this.particles]) for (const e of list) e.draw(ctx);
    this.player.draw(ctx, this, focus, showHitbox, this.shieldCharges, SHIPS.get(this.shipId));
  }
}

</script>
<script>
// HUD em HTML (vida, pontos, power-ups, barra do chefe).
class Hud {
  constructor() {
    const $ = id => document.getElementById(id);
    this.root = $('hud'); this.escHint = $('escHint');
    this.hp = $('hpDisplay'); this.score = $('scoreDisplay'); this.phase = $('phaseDisplay');
    this.powers = $('powersDisplay'); this.diff = $('diffDisplay');
    this.bossWrap = $('bossBarWrap'); this.bossFill = $('bossBarFill'); this.bossLabel = $('bossLabel');
  }

  // mode: 'none' | 'paused' | 'playing'
  setMode(mode) {
    this.root.classList.toggle('hidden', mode === 'none');
    this.escHint.classList.toggle('hidden', mode !== 'playing');
    this._showBoss(false);
  }

  _showBoss(visible) {
    this.bossWrap.classList.toggle('hidden', !visible);
    this.bossLabel.classList.toggle('hidden', !visible);
  }

  update(game) {
    const hp = Math.max(game.player.hp, 0);
    this.hp.textContent = 'Vida: ' + '♥ '.repeat(hp) + '· '.repeat(MAX_HP - hp);
    this.score.textContent = Math.floor(game.score);
    this.phase.textContent = (game.phase.index + 1) + ' / ' + PHASES.length;
    this.diff.textContent = game.difficulty;

    const powers = [];
    if (game.shotLevel > 0) powers.push(`Tiro Nv.${game.shotLevel + 1}`);
    if (game.fireLevel > 0) powers.push(`Cadência Nv.${game.fireLevel}`);
    if (game.shieldCharges > 0) powers.push(`Escudo x${game.shieldCharges}`);
    this.powers.textContent = powers.join(' | ');

    const boss = game.boss;
    this._showBoss(!!boss);
    if (boss) {
      this.bossLabel.textContent = boss.name;
      this.bossFill.style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
    }
  }
}

<script>
// Telas em HTML (menus, ranking, naves...) e navegação por teclado nos botões.
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

class ScreenManager {
  // nome do estado -> id do elemento
  static IDS = {
    main_menu: 'mainMenu', paused: 'pauseMenu', options: 'optionsMenu', ranking: 'rankingMenu',
    ships: 'shipsMenu', enter_name: 'enterNameMenu', game_over: 'gameOverMenu',
    phase_complete: 'phaseCompleteMenu', victory: 'victoryMenu',
  };

  constructor(app) {
    this.app = app;
    this.el = {};
    for (const [name, id] of Object.entries(ScreenManager.IDS)) this.el[name] = document.getElementById(id);
    this.menuIndex = 0;
  }

  show(name) {
    for (const el of Object.values(this.el)) el.classList.add('hidden');
    if (this.el[name]) this.el[name].classList.remove('hidden');
    const render = this['render_' + name];
    if (render) render.call(this);
    this.menuIndex = 0;
  }

  $(id) { return document.getElementById(id); }
  get settings() { return this.app.settings; }
  get session() { return this.app.session; }

  // ----- telas -----
  render_main_menu() {
    const has = this.app.store.hasSave();
    const btn = this.$('loadBtn');
    btn.disabled = !has;
    btn.textContent = has ? 'Carregar Jogo' : 'Carregar Jogo (vazio)';
    this.$('highScoreDisplay').textContent = Math.floor(this.settings.highScore);
  }

  render_options() {
    this.$('diffBtn').textContent = `Dificuldade: ${this.settings.difficulty}`;
    this.$('hitboxBtn').textContent = `Mostrar hitbox sempre: ${this.settings.showHitboxAlways ? 'Sim' : 'Não'}`;
  }

  render_ranking() {
    const list = this.app.store.loadRanking();
    let html = '<tr><th>#</th><th>Nome</th><th>Pontos</th><th>Fase</th></tr>';
    if (list.length === 0) html += '<tr><td colspan="4" style="text-align:center;color:#667;">Nenhum recorde ainda</td></tr>';
    list.forEach((e, i) => {
      html += `<tr><td>${i + 1}</td><td>${escapeHtml(e.name)}</td><td>${e.score}</td><td>${escapeHtml(e.phase || '')}</td></tr>`;
    });
    this.$('rankingTable').innerHTML = html;
  }

  render_ships() {
    const grid = this.$('shipsGrid');
    grid.innerHTML = '';
    let unlockedCount = 0;
    for (const ship of this.app.ships.list) {
      const unlocked = ship.isUnlocked(this.settings.highScore);
      if (unlocked) unlockedCount++;
      const selected = this.settings.selectedShip === ship.id;
      const card = document.createElement('div');
      card.className = 'ship-card' + (unlocked ? '' : ' locked') + (selected ? ' selected' : '');
      const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; card.appendChild(d); };

      if (unlocked) {
        const img = document.createElement('img');
        img.src = ship.src;
        card.appendChild(img);
        add('ship-name', ship.name);
        if (selected) add('ship-tag', '✓ EQUIPADA');
        card.addEventListener('click', () => {
          this.settings.selectedShip = ship.id;
          this.app.store.saveSettings(this.settings);
          this.render_ships();
        });
      } else {
        add('lock-icon', '🔒');
        add('ship-name', ship.secret ? '???' : ship.name);
        add('ship-lock', ship.secret ? `Nave secreta - ${ship.pointsNeeded()} pts` : `Precisa de ${ship.pointsNeeded()} pts`);
      }
      grid.appendChild(card);
    }
    this.$('shipsProgress').textContent =
      `${unlockedCount} / ${this.app.ships.list.length} naves desbloqueadas · Recorde atual: ${Math.floor(this.settings.highScore)} pts`;
  }

  render_enter_name() {
    this.$('enterNameStats').innerHTML = `<p>Pontuação: <b style="color:#ffcc66;">${Math.floor(this.app.pendingRanking.score)}</b></p>`;
    const input = this.$('nameInput');
    input.value = '';
    setTimeout(() => input.focus(), 50);
  }

  render_game_over() {
    const s = this.session;
    this.$('gameOverStats').innerHTML = `
      <p>Você chegou até a <b>${s.phase.name}</b></p>
      <p>Pontuação final: <b>${Math.floor(s.score)}</b></p>
      <p>Recorde: <b>${Math.floor(this.settings.highScore)}</b></p>`;
  }

  render_phase_complete() {
    this.$('phaseCompleteTitle').textContent = this.session.phase.name + ' - COMPLETA';
    this.$('phaseCompleteStats').innerHTML = `<p>Pontuação: <b>${Math.floor(this.session.score)}</b></p>`;
  }

  render_victory() {
    this.$('victoryStats').innerHTML =
      `<p>Pontuação final: <b>${Math.floor(this.session.score)}</b></p><p>Recorde: <b>${Math.floor(this.settings.highScore)}</b></p>`;
  }

  // ----- navegação por teclado (setas + Enter) -----
  visibleButtons(state) {
    const el = this.el[state];
    return el ? Array.from(el.querySelectorAll('.menu-btn')).filter(b => !b.disabled) : [];
  }

  // Retorna a ação do botão escolhido (ou null).
  handleKey(state, e) {
    const btns = this.visibleButtons(state);
    if (!btns.length) return null;
    const move = delta => {
      this.menuIndex = (this.menuIndex + delta + btns.length) % btns.length;
      btns.forEach(b => b.classList.remove('active'));
      btns[this.menuIndex].classList.add('active');
      e.preventDefault();
    };
    if (e.key === 'ArrowDown') move(1);
    else if (e.key === 'ArrowUp') move(-1);
    else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      return (btns[this.menuIndex] || btns[0]).dataset.action;
    }
    return null;
  }
}

</script>
<script>
// App: canvas, loop principal, estados e ações dos botões.
class App {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 200));

    this.store = new SaveStore();
    this.settings = this.store.loadSettings();
    this.ships = SHIPS;
    this.input = new Input(this.canvas);
    this.hud = new Hud();
    this.screens = new ScreenManager(this);

    this.session = null;
    this.state = 'main_menu';
    this.pendingRanking = null;   // { score, phaseLabel, nextScreen }
    this.lastTime = 0;
    this.actions = this._buildActions();

    this.input.bind(() => this.state === 'playing', () => this.handleEscape());
    this.hud.escHint.textContent = ('ontouchstart' in window) ? 'II Pausar' : 'ESC = pausar';
    this.hud.escHint.addEventListener('click', () => this.handleEscape());
    this._bindUi();
    this.go('main_menu');
  }

  // Campo de jogo com largura lógica fixa (480 em telas altas, 700 em telas largas) e altura
  // acompanhando a proporção da tela. O canvas é escalado por CSS para caber inteiro na janela.
  resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = vw / vh < 0.8 ? 480 : 700;
    const h = Math.round(Math.min(Math.max(w * vh / vw, 640), 960));
    if (this.canvas.width !== w) this.canvas.width = w;
    if (this.canvas.height !== h) this.canvas.height = h;
    const scale = Math.min(vw / w, vh / h);
    const cw = Math.floor(w * scale), ch = Math.floor(h * scale);
    this.canvas.style.width = cw + 'px';
    this.canvas.style.height = ch + 'px';
    const root = document.documentElement.style;       // o HUD em HTML se alinha ao campo de jogo
    root.setProperty('--gx', Math.round((vw - cw) / 2) + 'px');
    root.setProperty('--gy', Math.round((vh - ch) / 2) + 'px');
    root.setProperty('--gw', cw + 'px');
    document.documentElement.classList.toggle('narrow', cw < 600);
  }

  get showHitbox() { return this.settings.showHitboxAlways || this.input.touchActive; }

  // ---------- estados ----------
  go(name) {
    this.state = name;
    this.screens.show(name);
    this.hud.setMode(name === 'playing' ? 'playing' : name === 'paused' ? 'paused' : 'none');
  }

  handleEscape() {
    if (this.state === 'playing') this.go('paused');
    else if (this.state === 'paused') this.go('playing');
    else if (this.state === 'options') this.actions.back();
  }

  startSession(session) {
    this.session = session;
    this.input.reset(session.player);
    this.go('playing');
  }

  // Fim da partida ('game_over' ou 'victory'): atualiza recorde e pede o nome se entrou no ranking.
  finishRun(nextScreen) {
    const s = this.session;
    if (s.score > this.settings.highScore) { this.settings.highScore = s.score; this.store.saveSettings(this.settings); }
    if (s.score > 0 && this.store.rankingQualifies(s.score)) {
      this.pendingRanking = { score: s.score, phaseLabel: s.phase.name, nextScreen };
      this.go('enter_name');
    } else {
      this.go(nextScreen);
    }
  }

  _buildActions() {
    const save = () => this.store.saveSettings(this.settings);
    const toMenu = () => this.go('main_menu');
    return {
      new_game: () => {
        this.store.deleteSave();
        this.startSession(new GameSession(this.canvas, { difficulty: this.settings.difficulty, shipId: this.settings.selectedShip }));
      },
      load_game: () => {
        const data = this.store.loadGame();
        if (data) this.startSession(GameSession.restore(this.canvas, data, this.settings));
      },
      options: () => this.go('options'),
      ranking: () => this.go('ranking'),
      ships: () => this.go('ships'),
      quit: () => {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#0ff;font-family:monospace;font-size:1.4em;">Obrigado por jogar! Você pode fechar esta aba.</div>';
      },
      resume: () => this.go('playing'),
      save_exit: () => { this.store.saveGame(this.session.snapshot()); toMenu(); },
      quit_no_save: toMenu,
      back_to_menu: toMenu,
      toggle_difficulty: () => {
        const i = DIFFICULTIES.indexOf(this.settings.difficulty);
        this.settings.difficulty = DIFFICULTIES[(i + 1) % DIFFICULTIES.length];
        save(); this.go('options');
      },
      toggle_hitbox: () => {
        this.settings.showHitboxAlways = !this.settings.showHitboxAlways;
        save(); this.go('options');
      },
      back: () => { save(); toMenu(); },
      submit_name: () => {
        const name = document.getElementById('nameInput').value.trim() || 'Jogador';
        this.store.addToRanking(name, this.pendingRanking.score, this.pendingRanking.phaseLabel);
        this.store.deleteSave();
        this.go(this.pendingRanking.nextScreen);
      },
      next_phase: () => {
        if (this.session.phase.isLast) this.finishRun('victory');
        else { this.session.nextPhase(); this.go('playing'); }
      },
    };
  }

  doAction(name) { this.actions[name](); }

  _bindUi() {
    document.querySelectorAll('.menu-btn').forEach(btn => {
      btn.addEventListener('click', () => { if (!btn.disabled) this.doAction(btn.dataset.action); });
    });
    const nameInput = document.getElementById('nameInput');
    nameInput.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') this.doAction('submit_name');
    });
    window.addEventListener('keydown', e => {
      if (this.state === 'playing' || this.state === 'enter_name') return;
      const action = this.screens.handleKey(this.state, e);
      if (action) this.doAction(action);
    });
  }

  // ---------- loop ----------
  frame(now) {
    const dt = Math.min((now - this.lastTime) / 1000 || 0, 0.033);
    this.lastTime = now;
    const s = this.session;

    if (this.state === 'playing') {
      const focus = s.update(dt, this.input);
      s.draw(this.ctx, focus, this.showHitbox);
      this.hud.update(s);
      if (!s.alive) this.finishRun('game_over');
      else if (s.phase.isComplete) this.go('phase_complete');
    } else if (this.state === 'paused') {
      s.draw(this.ctx, false, this.showHitbox);
    }
    requestAnimationFrame(t => this.frame(t));
  }

  run() {
    this.lastTime = performance.now();
    requestAnimationFrame(t => this.frame(t));
  }
}

new App().run();

</script>
